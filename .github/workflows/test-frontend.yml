name: Tests — Frontend

# apps/lante_frontend had no test tooling at all until #194/#205. It now has 98 unit tests and
# 11 hermetic browser tests, and until this workflow existed none of them gated anything. See #214.
#
# Both suites here are deliberately hermetic: no server, no credentials, no network.
#   - `npm test`          vitest over src/, ~1s
#   - `npm run test:e2e`  Playwright against a production build served by vite preview, with every
#                         /api/** call intercepted, ~15s
#
# `npm run test:e2e:live` is NOT run here and must never be. It targets a real deployment, and the
# only real backend that exists is production (there is no staging — #221). Running it in CI would
# mean pointing every push at the live box.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/lante_frontend/**"
      - ".github/workflows/test-frontend.yml"
  push:
      # No branch filter, deliberately. CI now runs on the FORK — the base repo's Actions fail every
      # run in about a second, which is exhausted minutes rather than a broken build. On the fork a
      # feature branch produces only a `push` event (the PR is opened against the base repo, so no
      # `pull_request` event fires here), and with `branches: [main]` that meant a feature branch
      # triggered almost nothing. Merging unverified again is exactly what #253 was about, in a new
      # costume. Checks, not builds: the build-and-deploy workflows keep their main-only filter, because
      # a feature branch must never push an image or deploy.
    paths:
      - "apps/lante_frontend/**"
      - ".github/workflows/test-frontend.yml"

defaults:
  run:
    working-directory: apps/lante_frontend

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/lante_frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        # The build is part of the gate, not a separate concern: a type or import error that
        # vitest never imports still breaks the deployed bundle.
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/lante_frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run hermetic browser tests
        # playwright.config.js builds and serves the app itself via its webServer block.
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/lante_frontend/playwright-report/
          retention-days: 7
