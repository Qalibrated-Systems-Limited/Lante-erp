name: Build & Deploy Frontend Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/lante_frontend/**
      - .github/workflows/build-frontend.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lante-africa/lante-erp/frontend-service

jobs:
  build:
    if: github.repository == 'LANTE-AFRICA/Lante-erp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/lante_frontend
          file: ./apps/lante_frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://kmk.support.qalibrated.co.ke
            VITE_GOOGLE_CLIENT_ID=482476755428-ujkkgmgn4efqqp6lsb7l3qjm00unkmis.apps.googleusercontent.com

  deploy:
    needs: build
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/deploy-to-kubernetes.yml
    with:
      service-name: frontend
