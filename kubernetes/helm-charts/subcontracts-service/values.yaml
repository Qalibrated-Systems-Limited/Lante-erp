replicaCount: 1

image:
  repository: ghcr.io/lante-africa/lante-erp/subcontracts-service
  pullPolicy: Always
  tag: ""

imagePullSecrets:
  - name: ghcr-credentials

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "125m"
  limits:
    memory: "1Gi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: true
  auth:
    existingSecret: "lante-erp-secrets"
  primary:
    persistence:
      size: 10Gi

storage:
  publicBaseUrl: "https://kmk.support.qalibrated.co.ke"
  size: 5Gi
  storageClass: ""
