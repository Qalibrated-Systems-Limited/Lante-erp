apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "procurement-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "procurement-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "procurement-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "procurement-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "procurement-service.serviceAccountName" . }}
      containers:
      - name: procurement-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://+:8080"
          - name: JWT__Issuer
            value: "LanteUserService"
          - name: JWT__Audience
            value: "LanteUserService"
          - name: JWT__JwksUrl
            value: "http://lante-user-service:8080/.well-known/jwks.json"
          - name: JwtSettings__Issuer
            value: "LanteUserService"
          - name: JwtSettings__Audience
            value: "LanteUserService"
          # Procurement owns its schema-per-tenant provisioning; DefaultConnection needs DDL rights
          # (CREATE SCHEMA + migrations), so it uses the admin connection like the other services.
          # AppConnection is the least-privilege runtime connection the tenant interceptor uses.
          - name: ConnectionStrings__DefaultConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: PROCUREMENT_DB_CONNECTION
          - name: ConnectionStrings__AppConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: PROCUREMENT_APP_CONNECTION
          - name: InternalServices__ServiceKey
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: INTERNAL_SERVICE_KEY
          # P2 — Finance budget-check seam (hard budget block on PR submit).
          - name: Finance__Enabled
            value: "true"
          - name: FinanceService__BaseUrl
            value: "http://lante-finance-service:8080"
          # P9 — biannual supplier performance review scheduler (runs per tenant schema once a half closes).
          - name: Procurement__PerformanceReview__Enabled
            value: "true"
          - name: Procurement__PerformanceReview__IntervalHours
            value: "24"
          # DEC-B — READ-ONLY read of the stores supplier master for the ASR seed (stores is never written to).
          - name: Stores__Enabled
            value: "true"
          - name: StoresService__BaseUrl
            value: "http://lante-store-service:8080"
          # DEC-C — verify an LPO's Board Resolution against the compliance COMP-007 register (read-only).
          - name: Compliance__Enabled
            value: "true"
          - name: ComplianceService__BaseUrl
            value: "http://lante-compliance-service:8080"
          # Further cross-module seams (Stores / Compliance) added per phase (P4+).
        volumeMounts:
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
