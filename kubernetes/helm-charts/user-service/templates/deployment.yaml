apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "user-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "user-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "user-service.serviceAccountName" . }}
      initContainers:
        - name: wait-for-business-services
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Give the business services a head start so the startup seeder's tenant
              # provisioning (fans out to each service's /provision endpoint) succeeds on the
              # first try instead of racing pod startup. Bounded per service — never blocks
              # user-service from starting if one is genuinely down; the seeder retries are
              # non-fatal anyway (see DatabaseSeeder).
              for svc in lante-ticketing-service lante-operation-service lante-fleet-service lante-license-service lante-store-service; do
                echo "Waiting for $svc..."
                i=0
                until wget -q -T 3 -O /dev/null "http://$svc:8080/health" || [ "$i" -ge 30 ]; do
                  i=$((i+1))
                  sleep 5
                done
                echo "Done waiting for $svc."
              done
      containers:
      - name: user-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://+:8080"
          - name: UseRedis
            value: "true"
          - name: Google__ClientId
            value: "482476755428-ujkkgmgn4efqqp6lsb7l3qjm00unkmis.apps.googleusercontent.com"
          - name: JWT__Issuer
            value: "LanteUserService"
          - name: JWT__Audience
            value: "LanteUserService"
          - name: JwtSettings__Issuer
            value: "LanteUserService"
          - name: JwtSettings__Audience
            value: "LanteUserService"
          - name: ConnectionStrings__DefaultConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: USER_DB_CONNECTION
          - name: ConnectionStrings__AppConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: USER_APP_CONNECTION
          - name: ConnectionStrings__Redis
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: REDIS_CONNECTION
          - name: InternalServices__ServiceKey
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: INTERNAL_SERVICE_KEY
          - name: ProvisioningTargets__ticketing
            value: "http://lante-ticketing-service:8080"
          - name: ProvisioningTargets__operations
            value: "http://lante-operation-service:8080"
          - name: ProvisioningTargets__crm
            value: "http://lante-crm-service:8080"
          - name: ProvisioningTargets__procurement
            value: "http://lante-procurement-service:8080"
          - name: ProvisioningTargets__hr
            value: "http://lante-hr-service:8080"
          - name: ProvisioningTargets__finance
            value: "http://lante-finance-service:8080"
          - name: ProvisioningTargets__fleet
            value: "http://lante-fleet-service:8080"
          - name: ProvisioningTargets__licensing
            value: "http://lante-license-service:8080"
          - name: ProvisioningTargets__stores
            value: "http://lante-store-service:8080"
          - name: ProvisioningTargets__hse
            value: "http://lante-hse-service:8080"
          - name: ProvisioningTargets__compliance
            value: "http://lante-compliance-service:8080"
          - name: ProvisioningTargets__subcontracts
            value: "http://lante-subcontracts-service:8080"
          - name: ProvisioningTargets__reporting
            value: "http://lante-reporting-service:8080"
          # RSA keypair(s) user-service alone signs JWTs with (#215) — every other service verifies
          # via GET /.well-known/jwks.json instead of holding this secret.
          - name: JWT_SIGNING_KEYS
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: JWT_SIGNING_KEYS
          - name: Email__SmtpHost
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_HOST
          - name: Email__SmtpPort
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_PORT
          - name: Email__SmtpUsername
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_USERNAME
          - name: Email__SmtpPassword
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_PASSWORD
          - name: Email__FromEmail
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_USERNAME
          - name: Email__FromName
            value: "Lante System"
          - name: Encryption__TenantSecretsKey
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: TENANT_SECRETS_ENCRYPTION_KEY
          - name: Storage__BasePath
            value: "/app/uploads"
          - name: Storage__BaseUrl
            value: {{ .Values.storage.publicBaseUrl | quote }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: logs
            mountPath: /app/logs
          - name: uploads
            mountPath: /app/uploads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "user-service.fullname" . }}-uploads
