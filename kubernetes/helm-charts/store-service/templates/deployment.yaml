apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "store-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "store-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "store-service.serviceAccountName" . }}
      containers:
      - name: store-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://+:8080"
          - name: JwtSettings__Issuer
            value: "LanteUserService"
          - name: JwtSettings__Audience
            value: "LanteUserService"
          - name: ConnectionStrings__DefaultConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: STORE_DB_CONNECTION
          - name: ConnectionStrings__AppConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: STORE_APP_CONNECTION
          - name: InternalServices__ServiceKey
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: INTERNAL_SERVICE_KEY
          - name: Storage__BasePath
            value: "/app/uploads"
          - name: Storage__BaseUrl
            value: {{ .Values.storage.publicBaseUrl | quote }}
          # P5 (DEC-3) — notify procurement when an LPO-linked GRN passes inspection
          - name: Procurement__Enabled
            value: "true"
          - name: ProcurementService__BaseUrl
            value: "http://lante-procurement-service:8080"
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: logs
            mountPath: /app/logs
          - name: uploads
            mountPath: /app/uploads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "store-service.fullname" . }}-uploads
