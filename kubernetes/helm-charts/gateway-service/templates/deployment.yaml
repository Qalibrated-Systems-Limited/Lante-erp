apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gateway-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
        checksum/yarp-config: {{ .Files.Get "yarp.json" | sha256sum }}
      labels:
        {{- include "gateway-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gateway-service.serviceAccountName" . }}
      containers:
      - name: gateway-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
          {{- range $key, $value := .Values.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          - name: JWT__Issuer
            value: "LanteUserService"
          - name: JWT__Audience
            value: "LanteUserService"
          - name: JWT__JwksUrl
            value: "http://lante-user-service:8080/.well-known/jwks.json"
          - name: InternalServices__ServiceKey
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: INTERNAL_SERVICE_KEY
          - name: UserService__BaseUrl
            value: "http://lante-user-service:8080"
          - name: UseRedis
            value: "true"
          - name: ConnectionStrings__Redis
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: REDIS_CONNECTION
        envFrom:
          - secretRef:
              name: lante-erp-secrets
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: yarp-config
            mountPath: /app/yarp.json
            subPath: yarp.json
            readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: yarp-config
          configMap:
            name: {{ include "gateway-service.fullname" . }}-yarp-config
