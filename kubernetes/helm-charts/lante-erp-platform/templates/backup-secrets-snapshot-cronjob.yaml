{{- if .Values.backups.enabled }}
# Snapshots the live lante-erp-secrets Secret — an EXPORT of current values, never a
# regeneration. This must never run generate-secrets.sh or otherwise mint new credentials; it
# only reads what's already live via the Kubernetes API (in-cluster ServiceAccount auth, no
# extra kubeconfig needed) and encrypts a point-in-time copy.
#
# Unlike the other backup jobs' B2-upload step, there is no unencrypted fallback here: writing
# plaintext secrets (DB passwords, JWT signing key, license private key) to any disk — even the
# local backup PVC — would be a worse outcome than not snapshotting them yet. If
# BACKUP_ENCRYPTION_PASSPHRASE isn't configured, this job skips the export entirely rather than
# ever writing plaintext, and says so clearly in its logs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lante-backup-secrets-snapshot
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "lante-erp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: lante-backup-secrets-snapshot
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lante-backup-secrets-snapshot
        spec:
          restartPolicy: OnFailure
          serviceAccountName: lante-backup
          # bitnami/kubectl's install_packages (below) writes into the image's package-manager
          # config (Photon OS's tdnf, in this image — not Debian/apt despite the "gnupg2" name
          # this script tries first) — the image's default non-root user can't write there, so
          # every run silently crash-looped with a bare "Permission denied" the moment a real
          # BACKUP_ENCRYPTION_PASSPHRASE finally let execution reach this line (#409). Confirmed
          # live: non-root gets "Permission denied" on /etc/yum.repos.d; root installs gnupg fine
          # (gnupg2 genuinely doesn't exist as a package name here, gnupg does — the script's own
          # fallback already handles that part correctly).
          securityContext:
            runAsUser: 0
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: lante-backup-storage
          containers:
            - name: snapshot
              image: docker.io/bitnami/kubectl:latest
              env:
                - name: BACKUP_ENCRYPTION_PASSPHRASE
                  valueFrom: { secretKeyRef: { name: lante-backup-b2-credentials, key: BACKUP_ENCRYPTION_PASSPHRASE, optional: true } }
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
              command:
                - /bin/bash
                - -ec
                - |
                  if [ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
                    echo "No BACKUP_ENCRYPTION_PASSPHRASE configured (lante-backup-b2-credentials doesn't exist yet) — skipping the secrets snapshot entirely. Writing an unencrypted copy of lante-erp-secrets to disk would be worse than not backing it up yet. Create that secret key to enable this job. This is expected for now, not a failure."
                    exit 0
                  fi

                  install_packages gnupg2 >/dev/null 2>&1 || install_packages gnupg >/dev/null 2>&1

                  DEST="/dumps/secrets-snapshot"
                  mkdir -p "$DEST"
                  STAMP="$(date -u +%FT%H%M%SZ)"

                  echo "Exporting lante-erp-secrets (current values, not regenerated)..."
                  kubectl get secret lante-erp-secrets -n {{ .Values.global.namespace }} -o json > "/tmp/lante-erp-secrets-${STAMP}.json"

                  echo "Encrypting..."
                  gpg --batch --yes --passphrase "$BACKUP_ENCRYPTION_PASSPHRASE" --symmetric --cipher-algo AES256 \
                    -o "${DEST}/lante-erp-secrets-${STAMP}.json.gpg" "/tmp/lante-erp-secrets-${STAMP}.json"
                  shred -u "/tmp/lante-erp-secrets-${STAMP}.json" 2>/dev/null || rm -f "/tmp/lante-erp-secrets-${STAMP}.json"

                  echo "$(basename "${DEST}/lante-erp-secrets-${STAMP}.json.gpg")" > "${DEST}/latest.txt"
                  echo "Snapshot complete: ${DEST}/lante-erp-secrets-${STAMP}.json.gpg"

                  echo "Pruning local secrets snapshots older than 90 days (short-lived by design — this is a break-glass copy, not the long-term compliance retention that the logical dumps cover)..."
                  find "$DEST" -name "lante-erp-secrets-*.json.gpg" -mtime +90 -delete
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
{{- end }}
