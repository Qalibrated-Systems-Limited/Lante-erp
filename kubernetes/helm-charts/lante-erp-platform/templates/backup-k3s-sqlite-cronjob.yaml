{{- if and .Values.backups.enabled .Values.backups.k3sSqlite.enabled }}
# Backs up k3s's own control-plane state. This cluster uses k3s's DEFAULT SQLITE datastore, NOT
# embedded etcd (verified live: /var/lib/rancher/k3s/server/db/state.db is actively written; the
# etcd/ directory next to it is a stale, never-grown leftover from initial install) — so `k3s
# etcd-snapshot` does not apply here. Uses SQLite's own online-backup API (`.backup`) instead,
# which produces a consistent copy of a live-written file without needing to stop k3s.
#
# Separate opt-in sub-flag (backups.k3sSqlite.enabled) because this needs node-pinning + a
# hostPath mount — more cluster-topology-specific and more brittle than the other backup jobs,
# so it can be disabled independently if the node/datastore setup ever changes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lante-backup-k3s-sqlite
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "lante-erp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: lante-backup-k3s-sqlite
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lante-backup-k3s-sqlite
        spec:
          restartPolicy: OnFailure
          serviceAccountName: lante-backup
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: lante-backup-storage
            # Read-only — this job must never be able to write to or corrupt the live datastore.
            - name: k3s-db
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
          containers:
            - name: backup
              image: docker.io/keinos/sqlite3:3.53.4
              volumeMounts:
                - name: k3s-db
                  mountPath: /hostdb
                  readOnly: true
                - name: dumps
                  mountPath: /dumps
              command:
                - /bin/sh
                - -ec
                - |
                  DEST="/dumps/k3s-sqlite"
                  mkdir -p "$DEST"
                  STAMP="$(date -u +%FT%H%M%SZ)"
                  echo "Backing up k3s SQLite state (${STAMP})..."
                  sqlite3 /hostdb/state.db ".backup '${DEST}/state-${STAMP}.db'"
                  gzip "${DEST}/state-${STAMP}.db"
                  echo "$(basename "${DEST}/state-${STAMP}.db.gz")" > "${DEST}/latest.txt"
                  echo "Backup complete: ${DEST}/state-${STAMP}.db.gz"

                  echo "Pruning local k3s-sqlite backups older than 30 days..."
                  find "$DEST" -name "state-*.db.gz" -mtime +30 -delete
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
{{- end }}
