# ============================================================================
# Lante ERP Platform - Main Configuration
# ============================================================================

global:
  environment: production
  namespace: new-erp
  imagePullPolicy: Always
  imageRegistry: ""
  storageClass: "local-path"
ghcrSecret:
  dockerconfigjson: ""
  security:
    allowInsecureImages: true
  jwt:
    issuer: "LanteUserService"
    audience: "LanteUserService"
    expirationMinutes: 480
# ============================================================================
# INGRESS - Domains
# ============================================================================
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "new-erp-redirect-https@kubernetescrd"
  # Frontend — lante.africa → React app
  frontendHosts:
    - host: lante.africa
      paths:
        - path: /
          pathType: Prefix
          service: lante-frontend-service
          port: 80
  # Backend — kmk.support.qalibrated.co.ke → Ocelot API gateway
  backendHosts:
    - host: kmk.support.qalibrated.co.ke
      paths:
        - path: /
          pathType: Prefix
          service: lante-gateway
          port: 5000
  tls:
    - secretName: lante-erp-tls
      hosts:
        - lante.africa
        - kmk.support.qalibrated.co.ke
# ============================================================================
# FRONTEND SERVICE - React App (lante.africa)
# ============================================================================
frontendService:
  enabled: true
  replicaCount: 2
  fullnameOverride: "lante-frontend-service"
  image:
    repository: ghcr.io/lante-africa/lante-erp/frontend-service
    tag: "main-aa840db"
    pullPolicy: Always
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
# ============================================================================
# GATEWAY SERVICE - Ocelot API Gateway (kmk.support.qalibrated.co.ke)
# ============================================================================
gateway:
  enabled: true
  replicaCount: 2
  fullnameOverride: "lante-gateway"
  image:
    repository: ghcr.io/lante-africa/lante-erp/gateway-service
    tag: "main-e85f314"
    pullPolicy: Always
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  env:
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:5000"
# ============================================================================
# USER SERVICE - Authentication & User Management
# ============================================================================
userService:
  enabled: true
  replicaCount: 1
  fullnameOverride: "lante-user-service"
  image:
