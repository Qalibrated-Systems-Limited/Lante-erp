# ============================================================================
# TICKETING SERVICE - Support Ticket Management
# ============================================================================
ticketingService:
  enabled: true
  replicaCount: 1
  fullnameOverride: "lante-ticketing-service"
  image:
    repository: ghcr.io/lante-africa/lante-erp/ticketing-service
    tag: "main-e635000"
    pullPolicy: Always
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  storage:
    publicBaseUrl: "https://kmk.support.qalibrated.co.ke"
    size: 10Gi
    storageClass: "local-path"
  # Opt-in for Velero's File-System-Backup: only the named volume gets backed up (see
  # kubernetes/velero/ + GitHub issue #200 PR 4). Deliberately NOT using
  # defaultVolumesToFsBackup — that would also sweep the live Postgres/Redis data
  # directories, which isn't crash-consistent and would produce a backup that looks fine
  # while being subtly torn.
  podAnnotations:
    backup.velero.io/backup-volumes: uploads
  postgresql:
    enabled: false
