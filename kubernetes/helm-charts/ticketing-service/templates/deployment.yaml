apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ticketing-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketing-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ticketing-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ticketing-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ticketing-service.serviceAccountName" . }}
      containers:
      - name: ticketing-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://+:8080"
          - name: JWT__Issuer
            value: "LanteUserService"
          - name: JWT__Audience
            value: "LanteUserService"
          - name: JWT__JwksUrl
            value: "http://lante-user-service:8080/.well-known/jwks.json"
          - name: JwtSettings__Issuer
            value: "LanteUserService"
          - name: JwtSettings__Audience
            value: "LanteUserService"
          - name: UserService__BaseUrl
            value: "http://lante-user-service:8080"
          - name: FleetService__BaseUrl
            value: "http://lante-fleet-service:8080"
          - name: OperationsService__BaseUrl
            value: "http://lante-operation-service:8080"
          # D8-2/D8-3 — real CRM sink (closed-ticket interactions + resolved complaints) and D8-1 read
          - name: Integrations__Crm__Enabled
            value: "true"
          - name: CrmService__BaseUrl
            value: "http://lante-crm-service:8080"
          - name: ConnectionStrings__DefaultConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: TICKETING_DB_CONNECTION
          - name: ConnectionStrings__AppConnection
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: TICKETING_APP_CONNECTION
          - name: InternalServices__ServiceKey
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: INTERNAL_SERVICE_KEY
          - name: Smtp__Host
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_HOST
          - name: Smtp__Port
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_PORT
          - name: Smtp__Username
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_USERNAME
          - name: Smtp__Password
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_PASSWORD
          - name: Smtp__From
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: SMTP_USERNAME
          - name: Smtp__FromName
            value: "Lante Engineering"
          - name: Smtp__Enabled
            value: "true"
          - name: Storage__BasePath
            value: "/app/uploads"
          - name: Storage__BaseUrl
            value: {{ .Values.storage.publicBaseUrl | quote }}
          - name: Sms__Enabled
            value: "true"
          - name: Sms__Tiara__BaseUrl
            value: "https://api2.tiaraconnect.io/api/messaging/sendsms"
          - name: Sms__Tiara__ApiKey
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: TIARA_API_KEY
          - name: Sms__Tiara__SenderId
            valueFrom:
              secretKeyRef:
                name: lante-erp-secrets
                key: TIARA_SENDER_ID
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: uploads
            mountPath: /app/uploads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "ticketing-service.fullname" . }}-uploads
