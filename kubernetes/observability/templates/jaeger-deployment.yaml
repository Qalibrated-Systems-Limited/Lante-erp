apiVersion: apps/v1
kind: Deployment
metadata:
  name: lante-jaeger-collector
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lante-jaeger-collector
    app.kubernetes.io/part-of: lante-erp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lante-jaeger-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lante-jaeger-collector
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.image | quote }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: admin
              containerPort: 14269
          readinessProbe:
            httpGet: { path: /, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{ .Values.resources | toYaml | nindent 12 }}
