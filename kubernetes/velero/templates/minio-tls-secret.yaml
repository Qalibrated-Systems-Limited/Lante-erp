{{/*
Self-signed TLS cert for MinIO — required because pgBackRest (unlike Velero, which is fine with
plain HTTP) hard-requires TLS for any S3-type repository; there is no "use HTTP" option, only
"skip certificate verification" (repo1-storage-verify-tls=n), confirmed against pgBackRest's own
docs and community reports. Generated once and kept stable across syncs via the same
lookup-preserving pattern as the credentials secret — MinIO would otherwise present a new,
never-before-seen cert (and clients caching/pinning it would need to reconnect) on every sync.
*/}}
{{- $secretName := "lante-backup-minio-tls" }}
{{- $existing := (lookup "v1" "Secret" .Values.namespace $secretName) }}
{{- $cert := dict }}
{{- if $existing }}
{{- $cert = dict "Cert" (index $existing.data "tls.crt" | b64dec) "Key" (index $existing.data "tls.key" | b64dec) }}
{{- else }}
{{- $altNames := list "lante-backup-minio" (printf "lante-backup-minio.%s" .Values.namespace) (printf "lante-backup-minio.%s.svc" .Values.namespace) (printf "lante-backup-minio.%s.svc.cluster.local" .Values.namespace) }}
{{- $cert = genSelfSignedCert "lante-backup-minio" nil $altNames 3650 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lante-backup-minio
    app.kubernetes.io/part-of: lante-erp
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
