{{/*
Generates MinIO root credentials exactly once and keeps them stable forever after — via a real
`kubectl get || create` check at Job-run-time, NOT Helm's `lookup` function. Confirmed live
(2026-08-18) that `lookup` is not reliable across ArgoCD sync passes in this cluster: the
credentials Secret was observed to regenerate with a fresh random value on a later sync while
the already-running MinIO pod kept its original (now-mismatched) credentials — breaking
pgBackRest/Velero auth outright. A PreSync hook Job that does a genuine API check-then-create
has no such ambiguity: it either finds the Secret and does nothing, or it doesn't and creates
it once. Runs before the Deployment (PreSync) so the Secret exists when MinIO's pod starts.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: lante-backup-minio-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lante-backup-minio
    app.kubernetes.io/part-of: lante-erp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lante-backup-minio
    spec:
      restartPolicy: OnFailure
      serviceAccountName: lante-backup-minio-secret
      containers:
        - name: ensure-secret
          image: {{ .Values.minio.kubectlImage | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              NS="{{ .Values.namespace }}"
              NAME="lante-backup-minio-credentials"

              if kubectl get secret "$NAME" -n "$NS" >/dev/null 2>&1; then
                echo "Secret $NAME already exists — leaving it untouched."
                exit 0
              fi

              ACCESS_KEY="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c20)"
              SECRET_KEY="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c40)"
              CLOUD_INI="$(printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "$ACCESS_KEY" "$SECRET_KEY")"

              kubectl create secret generic "$NAME" -n "$NS" \
                --from-literal=MINIO_ROOT_USER="$ACCESS_KEY" \
                --from-literal=MINIO_ROOT_PASSWORD="$SECRET_KEY" \
                --from-literal=cloud="$CLOUD_INI"

              echo "Created $NAME."
