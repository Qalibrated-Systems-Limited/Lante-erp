{{/*
All three objects here are PreSync hooks at sync-wave -1 (not the default "Sync" phase), because
the minio-secret.yaml Job that NEEDS this ServiceAccount is itself a PreSync hook at the default
wave 0 — PreSync hooks all run before any "Sync" phase resource, so a plain (non-hook) RBAC
resource would apply too late and the Job would fail with "serviceaccount ... not found"
(confirmed live). No hook-delete-policy: these persist across syncs, unlike the Job.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lante-backup-minio-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lante-backup-minio
    app.kubernetes.io/part-of: lante-erp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lante-backup-minio-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lante-backup-minio
    app.kubernetes.io/part-of: lante-erp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # get, scoped to exactly this one secret name — to check existence.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["lante-backup-minio-credentials"]
  # create can't be scoped by resourceNames (the object doesn't exist yet on first run), so this
  # is namespace-scoped instead — still just `create`, no update/patch/delete on anything.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lante-backup-minio-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lante-backup-minio
    app.kubernetes.io/part-of: lante-erp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lante-backup-minio-secret
subjects:
  - kind: ServiceAccount
    name: lante-backup-minio-secret
    namespace: {{ .Values.namespace }}
