# Bootstrap file — like jaeger-application.yaml and velero-application.yaml, this is applied
# manually ONCE (`kubectl apply -f kubernetes/argocd/sealed-secrets-application.yaml`) to
# register the Application with ArgoCD. Deploys Bitnami's official Sealed Secrets controller
# (external Helm chart, same pattern velero-application.yaml uses) into new-erp. See #222: this
# is the chosen "smallest step" to get secret material into the GitOps flow — the controller
# holds the only private key that can decrypt a SealedSecret, so ciphertext produced by
# kubernetes/secrets/seal-secrets.sh is safe to commit to this public-ish repo.
#
# Ordering note: this Application must be synced and the controller running BEFORE
# lante-secrets-application.yaml's SealedSecret can be decrypted — a SealedSecret applied with no
# controller present just sits there inert (harmless, but see kubernetes/secrets/ROTATION.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lante-sealed-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: lante-sealed-secrets
    app.kubernetes.io/part-of: lante-erp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.3
    helm:
      values: |
        fullnameOverride: "lante-sealed-secrets"
        # Where the controller Deployment itself runs — not a watch-scope restriction (the
        # controller watches SealedSecrets cluster-wide regardless), just keeping it alongside
        # everything else on this single-tenant cluster instead of the chart's kube-system
        # default.
        namespace: new-erp
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 200m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: new-erp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
