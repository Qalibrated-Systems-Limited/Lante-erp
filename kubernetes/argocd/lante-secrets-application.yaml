# Bootstrap file — like the other Applications under kubernetes/argocd/, applied manually ONCE
# (`kubectl apply -f kubernetes/argocd/lante-secrets-application.yaml`) to register the
# Application with ArgoCD. After that, this is the part of #222 that actually closes the "secrets
# are an out-of-band manual step" gap: kubernetes/secrets/sealed/ holds SealedSecret manifests
# (ciphertext only, produced by kubernetes/secrets/seal-secrets.sh — see that script and
# kubernetes/secrets/ROTATION.md), and from here on a rotation is just "reseal, commit, let
# ArgoCD apply it" like every other change in this repo, instead of a human running
# create-k8s-secrets.sh against a live cluster by hand.
#
# `automated` is safe here in a way it deliberately isn't for lante-erp-application.yaml (#221):
# the content of this path is always encrypted SealedSecret ciphertext, never a live Secret, so
# there is nothing for a bad automatic apply to expose that committing it to git didn't already
# make possible in principle — only the cluster holding lante-sealed-secrets' private key can ever
# turn it back into plaintext.
#
# Depends on lante-sealed-secrets (sealed-secrets-application.yaml) already being synced — a
# SealedSecret applied with no controller running to decrypt it just sits inert, harmlessly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lante-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: lante-secrets
    app.kubernetes.io/part-of: lante-erp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/LANTE-AFRICA/Lante-erp.git
    targetRevision: main
    path: kubernetes/secrets/sealed
  destination:
    server: https://kubernetes.default.svc
    namespace: new-erp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
