# ServiceMonitors for Lante microservices
# Plugs into the existing Prometheus stack on qalibrated.co.ke
# Apply: kubectl apply -f servicemonitors.yaml -n new-erp

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lante-gateway
  namespace: new-erp
  labels:
    app.kubernetes.io/name: lante-gateway
    app.kubernetes.io/part-of: lante-erp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

