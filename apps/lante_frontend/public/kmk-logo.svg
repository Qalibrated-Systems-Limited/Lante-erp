<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="1200"
     viewBox="0 0 1200 1200">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12"
                    flood-color="#000000"
                    flood-opacity="0.08"/>
    </filter>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1062C"/>
      <stop offset="100%" stop-color="#D90429"/>
    </radialGradient>
  </defs>

  <!-- Red Sun -->
  <circle cx="600" cy="360" r="220"
          fill="url(#sunGradient)"
          filter="url(#shadow)"/>

  <!-- Torii Gate -->
  <g fill="#111111" filter="url(#shadow)">
    <path d="M390 300 Q600 390 810 300 L785 335 Q600 405 415 335 Z"/>
    <rect x="430" y="385" width="340" height="26"/>
    <rect x="455" y="438" width="290" height="24"/>
    <rect x="505" y="385" width="32" height="190"/>
    <rect x="663" y="385" width="32" height="190"/>
    <rect x="497" y="560" width="48" height="18"/>
    <rect x="655" y="560" width="48" height="18"/>
  </g>

  <!-- Curved Hill -->
  <path d="M350 660 Q600 560 850 660"
        fill="none"
        stroke="#111111"
        stroke-width="28"
        stroke-linecap="round"
        filter="url(#shadow)"/>

  <!-- Sakura Blossoms -->
  <g fill="#111111">
    <circle cx="765" cy="255" r="6"/>
    <circle cx="790" cy="270" r="5"/>
    <circle cx="815" cy="250" r="7"/>
    <circle cx="800" cy="290" r="5"/>
  </g>

  <!-- KMK Text -->
  <text x="600" y="840"
        text-anchor="middle"
        font-family="Anton, 'Bebas Neue', sans-serif"
        font-size="110"
        font-weight="900"
        letter-spacing="4"
        fill="#D90429">KMK</text>

  <!-- Red Seal -->
  <rect x="815" y="730" width="70" height="140"
        fill="none" stroke="#D90429" stroke-width="4" rx="4"/>
  <text x="850" y="765"
        text-anchor="middle"
        font-family="serif"
        font-size="26"
        fill="#D90429"
        writing-mode="tb">純粋な魂</text>

  <!-- PURE SOULS -->
  <text x="600" y="910"
        text-anchor="middle"
        font-family="Montserrat, sans-serif"
        font-size="28"
        font-weight="600"
        letter-spacing="8"
        fill="#111111">PURE SOULS</text>

  <!-- Decorative Lines -->
  <line x1="390" y1="898" x2="500" y2="898" stroke="#D90429" stroke-width="3"/>
  <line x1="700" y1="898" x2="810" y2="898" stroke="#D90429" stroke-width="3"/>

</svg>
